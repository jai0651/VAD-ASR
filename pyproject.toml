[project]
name = "vad-asr-from-scratch"
version = "0.1.0"
description = "Building Voice Activity Detection (VAD) and Automatic Speech Recognition (ASR) from scratch, for learning."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "soundfile>=0.12",
    # --- production pipeline (Module 3) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "silero-vad>=5.1",
    "onnxruntime>=1.17",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "anthropic>=0.116.0",
    "openai>=2.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv]
# CPU/MPS wheels are the default on macOS arm64.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
